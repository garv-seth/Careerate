<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Careerate - AI-powered DevOps platform. Deploy to any cloud with natural language." />
    <meta name="theme-color" content="#F97316" />
    <title>Careerate - AI DevOps Platform</title>
    <link rel="icon" type="image/x-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://app.posthog.com"/>
    <link rel="preconnect" href="https://plausible.io"/>
    <link rel="dns-prefetch" href="https://app.posthog.com"/>
    <link rel="dns-prefetch" href="https://plausible.io"/>
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    <meta name="color-scheme" content="dark" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Careerate" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Handle Vite HMR WebSocket errors gracefully in Replit environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && 
            event.reason.message.includes("Failed to construct 'WebSocket'") &&
            event.reason.message.includes("localhost:undefined")) {
          // Suppress the WebSocket connection error for Vite HMR
          console.log('Note: Vite HMR WebSocket connection failed (this is expected in Replit environment and does not affect functionality)');
          event.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
